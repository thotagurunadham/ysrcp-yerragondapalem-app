<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0066cc, #008f5a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-screen {
      width: 100%;
      max-width: 390px;
      min-height: 720px;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    .header {
      background: linear-gradient(160deg, #075fc4, #008b61);
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    .header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .header h2 {
      font-size: 19px;
      margin-top: 5px;
    }

    .header p {
      margin-top: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .content {
      padding: 35px 25px;
    }

    .back-button {
      border: none;
      background: transparent;
      color: #075fc4;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    h3 {
      text-align: center;
      color: #183b65;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #183b65;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #075fc4;
    }

    .main-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 10px;
      background: #08a65b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      padding: 15px;
      background: #f0f7f3;
      border-radius: 10px;
      color: #35634c;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .footer {
      text-align: center;
      background: #f2f7fb;
      padding: 20px;
      color: #24466c;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="app-screen">

    <header class="header">
      <h1>YSRCP</h1>
      <h2>YERRAGONDAPALEM</h2>
      <p>PEOPLE • PROGRESS • PROSPERITY</p>
    </header>

    <section class="content">

      <button class="back-button" onclick="goBack()">← Back</button>

      <h3>New Registration</h3>

      <p class="description">
        Enter your mobile number to continue
      </p>

      <label for="mobile">Mobile Number</label>

      <input
        type="tel"
        id="mobile"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
      >

      <button class="main-button" onclick="sendOTP()">
        Send OTP
      </button>

      <div class="note">
        Your mobile number will be used for OTP verification
        and account registration.
      </div>

    </section>

    <footer class="footer">
      <strong>YSRCP YERRAGONDAPALEM</strong><br>
      Digital Platform for Party Members
    </footer>

  </main>

  <script>
    function sendOTP() {
      const mobile = document.getElementById("mobile").value;

      if (mobile.length !== 10 || isNaN(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
      }

      alert("OTP screen will open in the next step.");
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
