<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans Telugu", sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #172033;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0759c8, #123b91);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .login-box h1 {
      color: #0759c8;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .login-box p {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      background: #fff;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #0759c8;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: #0759c8;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 8px;
    }

    .primary-btn:hover {
      background: #0647a0;
    }

    .login-error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 12px;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 65px;
      background: #0759c8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .menu-btn {
      border: none;
      background: transparent;
      color: white;
      font-size: 27px;
      width: 38px;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 19px;
      position: relative;
    }

    .notification-dot {
      position: absolute;
      right: 5px;
      top: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1100;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 290px;
      max-width: 85%;
      background: white;
      z-index: 1200;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-top {
      background: #0759c8;
      color: white;
      padding: 24px 18px;
    }

    .sidebar-top h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .sidebar-top p {
      font-size: 13px;
      opacity: 0.9;
    }

    .sidebar-menu {
      padding: 10px 0;
    }

    .sidebar-menu button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      background: white;
      text-align: left;
      color: #334155;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-menu button:hover {
      background: #eff6ff;
      color: #0759c8;
    }

    .sidebar-menu .logout {
      color: #dc2626;
    }

    .main-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 15px 105px;
    }

    .page-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .section-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(15,23,42,0.06);
    }

    .id-card {
      background: white;
      border: 2px solid #0759c8;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .id-card-header {
      background: #0759c8;
      color: white;
      text-align: center;
      padding: 13px 8px;
    }

    .id-card-header h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .id-card-header p {
      font-size: 12px;
    }

    .id-card-body {
      display: grid;
      grid-template-columns: 85px 1fr 85px;
      gap: 10px;
      padding: 15px;
      align-items: start;
    }

    .fixed-photo,
    .member-photo {
      width: 100%;
      height: 105px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .member-photo-box {
      text-align: center;
    }

    .member-photo-box label {
      display: block;
      font-size: 10px;
      color: #64748b;
      margin-top: 5px;
    }

    .member-details {
      min-width: 0;
    }

    .member-details h3 {
      font-size: 15px;
      color: #0759c8;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .member-details p {
      font-size: 11px;
      margin: 5px 0;
      line-height: 1.4;
      word-break: break-word;
    }

    .member-details strong {
      color: #334155;
    }

    .id-card-footer {
      background: #eff6ff;
      padding: 10px;
      text-align: center;
      color: #0759c8;
      font-weight: bold;
      font-size: 12px;
    }

    .upload-photo {
      margin-top: 12px;
    }

    .upload-photo input {
      width: 100%;
      font-size: 12px;
    }

    .empty-posts {
      text-align: center;
      color: #64748b;
      padding: 50px 15px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      background: white;
    }

    .post-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(15,23,42,0.06);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-author {
      font-weight: bold;
      font-size: 14px;
    }

    .post-date {
      color: #64748b;
      font-size: 11px;
    }

    .post-text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    .post-media {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 10px;
      background: #f8fafc;
      margin-bottom: 10px;
    }

    .post-link {
      display: block;
      color: #0759c8;
      word-break: break-all;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }

    .post-actions button {
      border: none;
      background: #f1f5f9;
      color: #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .post-actions button.active {
      background: #dbeafe;
      color: #0759c8;
    }

    .comments-box {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }

    .comment-item {
      font-size: 12px;
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .comment-input {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .comment-input input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
    }

    .comment-input button {
      border: none;
      background: #0759c8;
      color: white;
      border-radius: 8px;
      padding: 0 12px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 900;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
    }

    .bottom-nav button {
      border: none;
      background: white;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      position: relative;
    }

    .bottom-nav button span {
      font-size: 23px;
    }

    .bottom-nav button.active {
      color: #0759c8;
      font-weight: bold;
    }

    .add-post-btn {
      position: fixed;
      right: 20px;
      bottom: 82px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0759c8;
      color: white;
      border: none;
      font-size: 31px;
      box-shadow: 0 6px 18px rgba(7,89,200,0.35);
      z-index: 850;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 19px;
    }

    .close-btn {
      border: none;
      background: #f1f5f9;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
    }

    .support-option {
      display: block;
      width: 100%;
      border: none;
      background: #eff6ff;
      color: #0759c8;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-align: left;
      font-weight: bold;
    }

    .danger-btn {
      width: 100%;
      border: none;
      background: #dc2626;
      color: white;
      padding: 13px;
      border-radius: 10px;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .id-card-body {
        grid-template-columns: 65px 1fr 65px;
        gap: 7px;
        padding: 10px;
      }

      .fixed-photo,
      .member-photo {
        height: 82px;
      }

      .member-details h3 {
        font-size: 12px;
      }

      .member-details p {
        font-size: 9px;
      }

      .id-card-header h2 {
        font-size: 15px;
      }

      .header-title {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <section id="loginPage">
    <div class="login-box">

      <img
        class="login-logo"
        src="logo.png"
        alt="YSRCP Logo"
        onerror="this.style.display='none'"
      />

      <h1>YSRCP YERRAGONDAPALEM</h1>
      <p>Member Login</p>

      <div class="input-group">
        <label>10 Digit Mobile Number</label>
        <input
          type="tel"
          id="loginMobile"
          maxlength="10"
          placeholder="Enter mobile number"
        />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          maxlength="4"
          placeholder="Enter first 4 digits of mobile"
        />
      </div>

      <button class="primary-btn" onclick="loginUser()">
        Login
      </button>

      <p id="loginError" class="login-error"></p>
    </div>
  </section>

  <section id="appPage" class="hidden">

    <header class="top-header">
      <div class="header-left">
        <button class="menu-btn" onclick="openSidebar()">☰</button>
        <div class="header-title">YSRCP YERRAGONDAPALEM</div>
      </div>

      <div class="header-actions">
        <button class="header-icon" onclick="showNotifications()">
          🔔
          <span class="notification-dot"></span>
        </button>

        <button class="header-icon" onclick="openSupport()">
          🛠
        </button>
      </div>
    </header>

    <div
      id="sidebarOverlay"
      class="sidebar-overlay hidden"
      onclick="closeSidebar()"
    ></div>

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-top">
        <h2>YSRCP YERRAGONDAPALEM</h2>
        <p id="sidebarMemberName">Member</p>
      </div>

      <div class="sidebar-menu">
        <button onclick="showPage('home'); closeSidebar()">🏠 Home</button>
        <button onclick="showPage('profile'); closeSidebar()">👤 Profile</button>
        <button onclick="showPage('idcard'); closeSidebar()">🪪 ID Card</button>
        <button onclick="showPage('saved'); closeSidebar()">🔖 Saved Posts</button>
        <button onclick="showPage('myposts'); closeSidebar()">📝 My Posts</button>
        <button onclick="showPage('news'); closeSidebar()">📰 News & Media</button>
        <button onclick="showPage('gallery'); closeSidebar()">🖼 Gallery</button>
        <button onclick="showPage('events'); closeSidebar()">📅 Events</button>
        <button onclick="showPage('live'); closeSidebar()">🔴 Live Updates</button>
        <button onclick="showPage('surveys'); closeSidebar()">📊 Surveys</button>
        <button onclick="showPage('whatsapp'); closeSidebar()">💬 WhatsApp Channel</button>
        <button onclick="showPage('youtube'); closeSidebar()">▶ YouTube Channel</button>
        <button onclick="showNotifications(); closeSidebar()">🔔 Notifications</button>
        <button onclick="showPage('settings'); closeSidebar()">⚙ Settings</button>
        <button onclick="shareApp(); closeSidebar()">📤 Share App</button>
        <button class="logout" onclick="logoutUser()">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content" id="mainContent"></main>

    <button
      id="addPostButton"
      class="add-post-btn"
      onclick="openPostModal()"
      title="Send Post"
    >
      +
    </button>

    <nav class="bottom-nav">
      <button id="navHome" onclick="showPage('home')">
        <span>🏠</span>
        Home
      </button>

      <button id="navNews" onclick="showPage('news')">
        <span>📰</span>
        News
      </button>

      <button id="navGallery" onclick="showPage('gallery')">
        <span>🖼</span>
        Gallery
      </button>

      <button id="navEvents" onclick="showPage('events')">
        <span>📅</span>
        Events
      </button>
    </nav>
  </section>

  <div id="modalArea"></div>

  <script>
    const APP_NAME = "YSRCP YERRAGONDAPALEM";

    const MANDAL_CODES = {
      "Peddaraveedu": "PDV",
      "Pedda Dornala": "PDL",
      "Yerragondapalem": "YGP",
      "Pullalacheruvu": "PLC",
      "Tripuranthakam": "TPK"
    };

    let currentUser = null;
    let currentPage = "home";

    let posts = JSON.parse(
      localStorage.getItem("ysrcp_posts") || "[]"
    );

    let users = JSON.parse(
      localStorage.getItem("ysrcp_users") || "{}"
    );

    function savePosts() {
      localStorage.setItem(
        "ysrcp_posts",
        JSON.stringify(posts)
      );
    }

    function saveUsers() {
      localStorage.setItem(
        "ysrcp_users",
        JSON.stringify(users)
      );
    }

    function loginUser() {
      const mobile = document
        .getElementById("loginMobile")
        .value
        .trim();

      const password = document
        .getElementById("loginPassword")
        .value
        .trim();

      const error = document.getElementById("loginError");

      if (!/^[6-9][0-9]{9}$/.test(mobile)) {
        error.textContent =
          "సరైన 10 digit mobile number ఇవ్వండి.";
        return;
      }

      if (password !== mobile.substring(0, 4)) {
        error.textContent =
          "Password మొబైల్ నంబర్‌లోని మొదటి 4 digits ఉండాలి.";
        return;
      }

      if (!users[mobile]) {
        users[mobile] = {
          mobile: mobile,
          name: "",
          designation: "",
          village: "",
          panchayat: "",
          mandal: "Peddaraveedu",
          memberId: "",
          photo: ""
        };

        users[mobile].memberId =
          generateMemberId(
            users[mobile].mandal,
            mobile
          );

        saveUsers();
      }

      currentUser = users[mobile];

      localStorage.setItem(
        "ysrcp_current_user",
        mobile
      );

      document
        .getElementById("loginPage")
        .classList.add("hidden");

      document
        .getElementById("appPage")
        .classList.remove("hidden");

      document.getElementById(
        "sidebarMemberName"
      ).textContent =
        currentUser.name || currentUser.mobile;

      showPage("home");
    }

    function generateMemberId(mandal, mobile) {
      const code =
        MANDAL_CODES[mandal] || "PDV";

      const lastThree =
        mobile.substring(7, 10);

      return "YGP-" + code + "-" + lastThree;
    }

    function logoutUser() {
      localStorage.removeItem(
        "ysrcp_current_user"
      );

      currentUser = null;
      location.reload();
    }

    function openSidebar() {
      document
        .getElementById("sidebar")
        .classList.add("open");

      document
        .getElementById("sidebarOverlay")
        .classList.remove("hidden");
    }

    function closeSidebar() {
      document
        .getElementById("sidebar")
        .classList.remove("open");

      document
        .getElementById("sidebarOverlay")
        .classList.add("hidden");
    }

    function showPage(page) {
      currentPage = page;

      document
        .querySelectorAll(".bottom-nav button")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      if (page === "home") {
        document
          .getElementById("navHome")
          .classList.add("active");
      }

      if (page === "news") {
        document
          .getElementById("navNews")
          .classList.add("active");
      }

      if (page === "gallery") {
        document
          .getElementById("navGallery")
          .classList.add("active");
      }

      if (page === "events") {
        document
          .getElementById("navEvents")
          .classList.add("active");
      }

      const main =
        document.getElementById("mainContent");

      if (page === "home") {
        main.innerHTML = `
          <h1 class="page-title">Home</h1>
          <p class="page-subtitle">
            Welcome to ${APP_NAME}
          </p>
          <div id="postsContainer"></div>
        `;

        renderPosts(posts);
      }

      else if (page === "profile") {
        renderProfile();
      }

      else if (page === "idcard") {
        renderIdCard();
      }

      else if (page === "saved") {
        main.innerHTML = `
          <h1 class="page-title">Saved Posts</h1>
          <p class="page-subtitle">
            మీరు సేవ్ చేసిన పోస్టులుfunction renderPosts(list) {
      const container =
        document.getElementById(
          "postsContainer"
        );

      if (!container) return;

      if (!list.length) {
        container.innerHTML = `
          <div class="empty-posts">
            <h3 style="margin-bottom:8px;">
              No Posts Available
            </h3>

            <p>
              ఇంకా ఎటువంటి పోస్టులు లేవు.
            </p>
          </div>
        `;

        return;
      }

      container.innerHTML = list.map(post => {
        const liked =
          post.likes?.includes(
            currentUser.mobile
          );

        const saved =
          post.savedBy?.includes(
            currentUser.mobile
          );

        return `
          <div class="post-card">

            <div class="post-header">
              <div>
                <div class="post-author">
                  ${escapeHtml(
                    post.authorName
                  )}
                </div>

                <div class="post-date">
                  ${escapeHtml(post.date)}
                </div>
              </div>
            </div>

            <div class="post-text">
              ${escapeHtml(post.text || "")}
            </div>

            ${
              post.media
                ? post.mediaType === "video"
                  ? `
                    <video
                      class="post-media"
                      controls
                      src="${post.media}">
                    </video>
                  `
                  : `
                    <img
                      class="post-media"
                      src="${post.media}"
                      alt="Post Image"
                    >
                  `
                : ""
            }

            ${
              post.link
                ? `
                  <a
                    class="post-link"
                    href="${escapeAttribute(post.link)}"
                    target="_blank">
                    ${escapeHtml(post.link)}
                  </a>
                `
                : ""
            }

            <div class="post-actions">

              <button
                class="${liked ? "active" : ""}"
                onclick="toggleLike('${post.id}')">
                ❤️ Like ${post.likes?.length || 0}
              </button>

              <button
                onclick="toggleComments('${post.id}')">
                💬 Comment ${post.comments?.length || 0}
              </button>

              <button
                onclick="sharePost('${post.id}')">
                📤 Share
              </button>

              <button
                class="${saved ? "active" : ""}"
                onclick="toggleSave('${post.id}')">
                🔖 Save
              </button>

            </div>

            <div
              id="comments-${post.id}"
              class="comments-box hidden">

              ${
                (post.comments || [])
                  .map(comment => `
                    <div class="comment-item">
                      <strong>
                        ${escapeHtml(comment.name)}:
                      </strong>

                      ${escapeHtml(comment.text)}
                    </div>
                  `)
                  .join("")
              }

              <div class="comment-input">
                <input
                  id="commentInput-${post.id}"
                  placeholder="Write comment..."
                >

                <button
                  onclick="addComment('${post.id}')">
                  Send
                </button>
              </div>

            </div>
          </div>
        `;
      }).join("");
    }

    function toggleLike(postId) {
      const post =
        posts.find(p => p.id === postId);

      if (!post) return;

      post.likes = post.likes || [];

      if (
        post.likes.includes(
          currentUser.mobile
        )
      ) {
        post.likes =
          post.likes.filter(
            m => m !== currentUser.mobile
          );
      } else {
        post.likes.push(
          currentUser.mobile
        );
      }

      savePosts();
      showPage(currentPage);
    }

    function toggleSave(postId) {
      const post =
        posts.find(p => p.id === postId);

      if (!post) return;

      post.savedBy =
        post.savedBy || [];

      if (
        post.savedBy.includes(
          currentUser.mobile
        )
      ) {
        post.savedBy =
          post.savedBy.filter(
            m => m !== currentUser.mobile
          );
      } else {
        post.savedBy.push(
          currentUser.mobile
        );
      }

      savePosts();
      showPage(currentPage);
    }

    function toggleComments(postId) {
      const box =
        document.getElementById(
          "comments-" + postId
        );

      if (box) {
        box.classList.toggle("hidden");
      }
    }

    function addComment(postId) {
      const input =
        document.getElementById(
          "commentInput-" + postId
        );

      const text =
        input.value.trim();

      if (!text) return;

      const post =
        posts.find(p => p.id === postId);

      if (!post) return;

      post.comments =
        post.comments || [];

      post.comments.push({
        name:
          currentUser.name ||
          currentUser.mobile,

        text: text
      });

      savePosts();
      showPage(currentPage);
    }

    function sharePost(postId) {
      const post =
        posts.find(p => p.id === postId);

      if (!post) return;

      const shareText =
        post.authorName +
        "\n\n" +
        post.text +
        "\n\n" +
        APP_NAME;

      if (navigator.share) {
        navigator.share({
          title: APP_NAME,
          text: shareText
        }).catch(() => {});
      } else {
        const whatsappUrl =
          "https://wa.me/?text=" +
          encodeURIComponent(shareText);

        window.open(
          whatsappUrl,
          "_blank"
        );
      }
    }

    function openPostModal() {
      document.getElementById(
        "modalArea"
      ).innerHTML = `
        <div
          class="modal-overlay"
          onclick="closeModal(event)">

          <div
            class="modal"
            onclick="event.stopPropagation()">

            <div class="modal-header">
              <h2>Send New Post</h2>

              <button
                class="close-btn"
                onclick="closeModal()">
                ×
              </button>
            </div>

            <div class="input-group">
              <label>Post Text</label>

              <textarea
                id="postText"
                rows="4"
                placeholder="Write your post">
              </textarea>
            </div>

            <div class="input-group">
              <label>Photo / Video</label>

              <input
                type="file"
                id="postMedia"
                accept="image/*,video/*">
            </div>

            <div class="input-group">
              <label>Social Media Link</label>

              <input
                id="postLink"
                placeholder="Paste YouTube / Facebook / Instagram link">
            </div>

            <button
              class="primary-btn"
              onclick="submitPost()">
              Send Post
            </button>

          </div>
        </div>
      `;
    }

    function submitPost() {
      const text =
        document.getElementById(
          "postText"
        ).value.trim();

      const link =
        document.getElementById(
          "postLink"
        ).value.trim();

      const file =
        document.getElementById(
          "postMedia"
        ).files[0];

      if (!text && !file && !link) {
        alert(
          "Post text, photo, video లేదా link ఏదైనా ఇవ్వండి."
        );

        return;
      }

      if (file) {
        const reader =
          new FileReader();

        reader.onload = function(e) {
          createPost(
            text,
            link,
            e.target.result,
            file.type.startsWith("video")
              ? "video"
              : "image"
          );
        };

        reader.readAsDataURL(file);
      } else {
        createPost(
          text,
          link,
          "",
          ""
        );
      }
    }

    function createPost(
      text,
      link,
      media,
      mediaType
    ) {
      const post = {
        id: Date.now().toString(),

        authorName:
          currentUser.name ||
          currentUser.mobile,

        authorMobile:
          currentUser.mobile,

        text: text,
        link: link,
        media: media,
        mediaType: mediaType,

        date:
          new Date().toLocaleString(
            "en-IN"
          ),

        likes: [],
        comments: [],
        savedBy: []
      };

      posts.unshift(post);

      savePosts();

      closeModal();

      alert(
        "Post sent successfully."
      );

      showPage("home");
    }

    function closeModal(event) {
      if (
        event &&
        event.target !==
        event.currentTarget
      ) {
        return;
      }

      document.getElementById(
        "modalArea"
      ).innerHTML = "";
    }

    function openSupport() {
      document.getElementById(
        "modalArea"
      ).innerHTML = `
        <div
          class="modal-overlay"
          onclick="closeModal(event)">

          <div
            class="modal"
            onclick="event.stopPropagation()">

            <div class="modal-header">
              <h2>Technical Support</h2>

              <button
                class="close-btn"
                onclick="closeModal()">
                ×
              </button>
            </div>

            <button
              class="support-option"
              onclick="openWhatsAppSupport()">
              💬 WhatsApp Support
            </button>

            <button
              class="support-option"
              onclick="openEmailSupport()">
              ✉ Email Support
            </button>

            <p
              style="font-size:12px;color:#64748b;margin-top:12px;">
              Technical Support: GURU SOLUTIONS
            </p>

          </div>
        </div>
      `;
    }

    function openWhatsAppSupport() {
      const number =
        "917207134205";

      const message =
        "Hello GURU SOLUTIONS, I need technical support.";

      window.open(
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
      );
    }

    function openEmailSupport() {
      window.location.href =
        "mailto:gurusolutions.hyd@gmail.com?subject=App Technical Support";
    }

    function showNotifications() {
      document.getElementById(
        "modalArea"
      ).innerHTML = `
        <div
          class="modal-overlay"
          onclick="closeModal(event)">

          <div
            class="modal"
            onclick="event.stopPropagation()">

            <div class="modal-header">
              <h2>Notifications</h2>

              <button
                class="close-btn"
                onclick="closeModal()">
                ×
              </button>
            </div>

            <div class="empty-posts">
              <p>
                కొత్త notifications వచ్చినప్పుడు ఇక్కడ కనిపిస్తాయి.
              </p>
            </div>

          </div>
        </div>
      `;
    }

    function renderSettings() {
      document.getElementById(
        "mainContent"
      ).innerHTML = `
        <h1 class="page-title">
          Settings
        </h1>

        <p class="page-subtitle">
          App settings
        </p>

        <div class="section-card">

          <button
            class="support-option"
            onclick="openSupport()">
            🛠 Technical Support
          </button>

          <button
            class="support-option"
            onclick="shareApp()">
            📤 Share App
          </button>

          <button
            class="danger-btn"
            onclick="logoutUser()">
            Logout
          </button>

        </div>
      `;
    }

    function shareApp() {
      const text =
        APP_NAME +
        "\n\nYSRCP Yerragondapalem Member App";

      if (navigator.share) {
        navigator.share({
          title: APP_NAME,
          text: text
        }).catch(() => {});
      } else {
        window.open(
          "https://wa.me/?text=" +
          encodeURIComponent(text),
          "_blank"
        );
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return String(value || "")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadSavedUser() {
      const mobile =
        localStorage.getItem(
          "ysrcp_current_user"
        );

      if (
        mobile &&
        users[mobile]
      ) {
        currentUser =
          users[mobile];

        document.getElementById(
          "loginPage"
        ).classList.add("hidden");

        document.getElementById(
          "appPage"
        ).classList.remove("hidden");

        document.getElementById(
          "sidebarMemberName"
        ).textContent =
          currentUser.name ||
          currentUser.mobile;

        showPage("home");
      }
    }

    loadSavedUser();
  </script>

</body>
