<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YSRCP YERRAGONDAPALEM</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff3d6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: #b56a00;
      font-size: 25px;
      margin-bottom: 10px;
    }

    h2 {
      color: #222;
      font-size: 24px;
      margin-bottom: 22px;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cccccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #d88900;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary {
      background: #d88900;
      color: white;
    }

    .primary:hover {
      background: #b96f00;
    }

    .dark {
      background: #222222;
      color: white;
    }

    .light {
      background: #eeeeee;
      color: #222222;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #d00000;
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: #168000;
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .top-space {
      margin-top: 20px;
    }

    .home-title {
      color: #b56a00;
      font-size: 27px;
      margin-bottom: 15px;
    }

    .user-mobile {
      background: #fff5df;
      padding: 13px;
      border-radius: 10px;
      color: #444;
      margin-bottom: 20px;
    }

    .small-text {
      font-size: 13px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- START SCREEN -->
    <div id="startScreen" class="card">

      <h1>YSRCP YERRAGONDAPALEM</h1>

      <p>
        Welcome to YSRCP Yerragondapalem App
      </p>

      <button class="primary" onclick="showRegistration()">
        New Registration
      </button>

      <button class="dark" onclick="showLogin()">
        Login
      </button>

      <div id="startError" class="error"></div>
    </div>


    <!-- REGISTRATION SCREEN -->
    <div id="registrationScreen" class="card hidden">

      <h2>New Registration</h2>

      <p>
        Enter your mobile number to continue
      </p>

      <input
        type="tel"
        id="registrationMobile"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      />

      <button class="primary" onclick="sendRegistrationOTP()">
        Send OTP
      </button>

      <button class="dark" onclick="goBack()">
        Back
      </button>

      <div id="registrationError" class="error"></div>
      <div id="registrationSuccess" class="success"></div>

      <!-- Invisible reCAPTCHA container -->
      <div id="registrationRecaptcha"></div>
    </div>


    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="card hidden">

      <h2>Login</h2>

      <p>
        Enter your registered mobile number
      </p>

      <input
        type="tel"
        id="loginMobile"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      />

      <button class="primary" onclick="sendLoginOTP()">
        Send OTP
      </button>

      <button class="dark" onclick="goBack()">
        Back
      </button>

      <div id="loginError" class="error"></div>
      <div id="loginSuccess" class="success"></div>

      <!-- Invisible reCAPTCHA container -->
      <div id="loginRecaptcha"></div>
    </div>


    <!-- OTP SCREEN -->
    <div id="otpScreen" class="card hidden">

      <h2>Verify OTP</h2>

      <p id="otpMessage">
        Enter the OTP sent to your mobile number
      </p>

      <input
        type="text"
        id="otpInput"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
      />

      <button class="primary" onclick="verifyOTP()">
        Verify OTP
      </button>

      <button class="dark" onclick="goBackToMobileScreen()">
        Back
      </button>

      <div id="otpError" class="error"></div>
      <div id="otpSuccess" class="success"></div>
    </div>


    <!-- HOME SCREEN -->
    <div id="homeScreen" class="card hidden">

      <div class="home-title">
        YSRCP YERRAGONDAPALEM
      </div>

      <div class="user-mobile">
        <b>Login Successful</b>
        <br />
        <span id="loggedMobile"></span>
      </div>

      <p>
        Welcome to the Home Screen
      </p>

      <button class="primary" onclick="logoutUser()">
        Logout
      </button>
    </div>

  </div>


  <script>

    /*
      IMPORTANT:
      Replace the below Firebase configuration
      with your own Firebase project configuration.
    */

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "PASTE_YOUR_PROJECT_ID",
      storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    let confirmationResult = null;
    let currentMode = "";
    let currentMobile = "";

    let registrationRecaptchaVerifier = null;
    let loginRecaptchaVerifier = null;


    function hideAllScreens() {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("registrationScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("otpScreen").classList.add("hidden");
      document.getElementById("homeScreen").classList.add("hidden");
    }


    function clearMessages() {
      document.getElementById("startError").innerText = "";

      document.getElementById("registrationError").innerText = "";
      document.getElementById("registrationSuccess").innerText = "";

      document.getElementById("loginError").innerText = "";
      document.getElementById("loginSuccess").innerText = "";

      document.getElementById("otpError").innerText = "";
      document.getElementById("otpSuccess").innerText = "";
    }


    function showRegistration() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("registrationScreen")
        .classList.remove("hidden");

      document.getElementById("registrationMobile").focus();
    }


    function showLogin() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

      document.getElementById("loginMobile").focus();
    }


    function goBack() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("startScreen")
        .classList.remove("hidden");
    }


    function goBackToMobileScreen() {
      hideAllScreens();
      clearMessages();

      if (currentMode === "registration") {
        document
          .getElementById("registrationScreen")
          .classList.remove("hidden");
      } else {
        document
          .getElementById("loginScreen")
          .classList.remove("hidden");
      }
    }


    function validateMobile(mobile) {
      return /^[6-9][0-9]{9}$/.test(mobile);
    }


    function createRegistrationRecaptcha() {
      if (!registrationRecaptchaVerifier) {
        registrationRecaptchaVerifier =
          new firebase.auth.RecaptchaVerifier(
            "registrationRecaptcha",
            {
              size: "invisible",
              callback: function () {
                console.log("Registration reCAPTCHA verified");
              },
              "expired-callback": function () {
                registrationRecaptchaVerifier = null;
              }
            }
          );

        registrationRecaptchaVerifier.render();
      }

      return registrationRecaptchaVerifier;
    }


    function createLoginRecaptcha() {
      if (!loginRecaptchaVerifier) {
        loginRecaptchaVerifier =
          new firebase.auth.RecaptchaVerifier(
            "loginRecaptcha",
            {
              size: "invisible",
              callback: function () {
                console.log("Login reCAPTCHA verified");
              },
              "expired-callback": function () {
                loginRecaptchaVerifier = null;
              }
            }
          );

        loginRecaptchaVerifier.render();
      }

      return loginRecaptchaVerifier;
    }


    function sendRegistrationOTP() {
      clearMessages();

      const mobile =
        document.getElementById("registrationMobile").value.trim();

      if (!validateMobile(mobile)) {
        document.getElementById("registrationError").innerText =
          "Please enter a valid 10 digit Indian mobile number.";

        return;
      }

      currentMode = "registration";
      currentMobile = mobile;

      const phoneNumber = "+91" + mobile;

      const appVerifier = createRegistrationRecaptcha();

      document.getElementById("registrationSuccess").innerText =
        "Sending OTP. Please wait...";

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then(function (result) {
          confirmationResult = result;

          hideAllScreens();

          document
            .getElementById("otpScreen")
            .classList.remove("hidden");

          document.getElementById("otpMessage").innerText =
            "Enter the OTP sent to +91 " + currentMobile;

          document.getElementById("otpInput").focus();
        })
        .catch(function (error) {
          document.getElementById("registrationSuccess").innerText = "";

          document.getElementById("registrationError").innerText =
            getFriendlyError(error);
        });
    }


    function sendLoginOTP() {
      clearMessages();

      const mobile =
        document.getElementById("loginMobile").value.trim();

      if (!validateMobile(mobile)) {
        document.getElementById("loginError").innerText =
          "Please enter a valid 10 digit Indian mobile number.";

        return;
      }

      currentMode = "login";
      currentMobile = mobile;

      const phoneNumber = "+91" + mobile;

      const appVerifier = createLoginRecaptcha();

      document.getElementById("loginSuccess").innerText =
        "Sending OTP. Please wait...";

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then(function (result) {
          confirmationResult = result;

          hideAllScreens();

          document
            .getElementById("otpScreen")
            .classList.remove("hidden");

          document.getElementById("otpMessage").innerText =
            "Enter the OTP sent to +91 " + currentMobile;

          document.getElementById("otpInput").focus();
        })
        .catch(function (error) {
          document.getElementById("loginSuccess").innerText = "";

          document.getElementById("loginError").innerText =
            getFriendlyError(error);
        });
    }


    function verifyOTP() {
      clearMessages();

      const otp =
        document.getElementById("otpInput").value.trim();

      if (!/^[0-9]{6}$/.test(otp)) {
        document.getElementById("otpError").innerText =
          "Please enter the 6 digit OTP.";

        return;
      }

      if (!confirmationResult) {
        document.getElementById("otpError").innerText =
          "OTP session expired. Please request a new OTP.";

        return;
      }

      document.getElementById("otpSuccess").innerText =
        "Verifying OTP. Please wait...";

      confirmationResult.confirm(otp)
        .then(function (result) {
          const user = result.user;

          document.getElementById("loggedMobile").innerText =
            user.phoneNumber || ("+91 " + currentMobile);

          hideAllScreens();

          document
            .getElementById("homeScreen")
            .classList.remove("hidden");
        })
        .catch(function (error) {
          document.getElementById("otpSuccess").innerText = "";

          document.getElementById("otpError").innerText =
            getFriendlyError(error);
        });
    }


    function logoutUser() {
      auth.signOut()
        .then(function () {
          confirmationResult = null;
          currentMode = "";
          currentMobile = "";

          document.getElementById("otpInput").value = "";

          goBack();
        })
        .catch(function (error) {
          document.getElementById("otpError").innerText =
            getFriendlyError(error);
        });
    }


    function getFriendlyError(error) {
      if (!error || !error.code) {
        return "Something went wrong. Please try again.";
      }

      switch (error.code) {
        case "auth/invalid-phone-number":
          return "Invalid mobile number. Please check and try again.";

        case "auth/too-many-requests":
          return "Too many OTP requests. Please wait and try again later.";

        case "auth/quota-exceeded":
          return "SMS quota exceeded. Please try again later.";

        case "auth/operation-not-allowed":
          return "Phone Authentication is not enabled in Firebase.";

        case "auth/captcha-check-failed":
          return "Security verification failed. Please refresh the page and try again.";

        case "auth/invalid-verification-code":
          return "Incorrect OTP. Please enter the correct OTP.";

        case "auth/code-expired":
          return "OTP expired. Please request a new OTP.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        case "auth/unauthorized-domain":
          return "This website domain is not authorized in Firebase.";

        default:
          return error.message || "Something went wrong. Please try again.";
      }
    }


    auth.onAuthStateChanged(function (user) {
      if (user) {
        document.getElementById("loggedMobile").innerText =
          user.phoneNumber || "";

        hideAllScreens();

        document
          .getElementById("homeScreen")
          .classList.remove("hidden");
      } else {
        hideAllScreens();

        document
          .getElementById("startScreen")
          .classList.remove("hidden");
      }
    });

  </script>

</body>
</html>
