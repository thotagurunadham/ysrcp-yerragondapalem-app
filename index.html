<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YSRCP YERRAGONDAPALEM</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff1d2, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 30px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      color: #b56a00;
      font-size: 25px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    h2 {
      color: #222222;
      font-size: 25px;
      margin-bottom: 15px;
    }

    p {
      color: #555555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cccccc;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #d88900;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .primary {
      background: #d88900;
      color: #ffffff;
    }

    .primary:hover {
      background: #b96f00;
    }

    .dark {
      background: #222222;
      color: #ffffff;
    }

    .light {
      background: #eeeeee;
      color: #222222;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c00000;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 16px;
      word-break: break-word;
    }

    .success {
      color: #168000;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 16px;
    }

    .home-title {
      color: #b56a00;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .mobile-box {
      background: #fff4dc;
      color: #444444;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .recaptcha-box {
      margin-top: 10px;
      min-height: 1px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- START SCREEN -->
    <section id="startScreen" class="card">

      <h1>YSRCP YERRAGONDAPALEM</h1>

      <p>
        Welcome to YSRCP Yerragondapalem App
      </p>

      <button
        id="newRegistrationButton"
        class="primary"
        onclick="showRegistration()"
      >
        New Registration
      </button>

      <button
        id="loginButton"
        class="dark"
        onclick="showLogin()"
      >
        Login
      </button>

      <div id="startError" class="error"></div>

    </section>


    <!-- REGISTRATION SCREEN -->
    <section id="registrationScreen" class="card hidden">

      <h2>New Registration</h2>

      <p>
        Enter your mobile number to continue
      </p>

      <input
        id="registrationMobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="Enter 10 digit mobile number"
      />

      <button
        id="registrationSendButton"
        class="primary"
        onclick="sendRegistrationOTP()"
      >
        Send OTP
      </button>

      <button
        class="dark"
        onclick="goBack()"
      >
        Back
      </button>

      <div id="registrationError" class="error"></div>
      <div id="registrationSuccess" class="success"></div>

      <!-- Invisible reCAPTCHA -->
      <div id="registrationRecaptcha" class="recaptcha-box"></div>

    </section>


    <!-- LOGIN SCREEN -->
    <section id="loginScreen" class="card hidden">

      <h2>Login</h2>

      <p>
        Enter your registered mobile number
      </p>

      <input
        id="loginMobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="Enter 10 digit mobile number"
      />

      <button
        id="loginSendButton"
        class="primary"
        onclick="sendLoginOTP()"
      >
        Send OTP
      </button>

      <button
        class="dark"
        onclick="goBack()"
      >
        Back
      </button>

      <div id="loginError" class="error"></div>
      <div id="loginSuccess" class="success"></div>

      <!-- Invisible reCAPTCHA -->
      <div id="loginRecaptcha" class="recaptcha-box"></div>

    </section>


    <!-- OTP SCREEN -->
    <section id="otpScreen" class="card hidden">

      <h2>Verify OTP</h2>

      <p id="otpMessage">
        Enter the OTP sent to your mobile number
      </p>

      <input
        id="otpInput"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6 digit OTP"
      />

      <button
        id="verifyButton"
        class="primary"
        onclick="verifyOTP()"
      >
        Verify OTP
      </button>

      <button
        class="dark"
        onclick="goBackToMobileScreen()"
      >
        Back
      </button>

      <div id="otpError" class="error"></div>
      <div id="otpSuccess" class="success"></div>

    </section>


    <!-- HOME SCREEN -->
    <section id="homeScreen" class="card hidden">

      <div class="home-title">
        YSRCP YERRAGONDAPALEM
      </div>

      <div class="mobile-box">
        <b>Login Successful</b>
        <br />
        <span id="loggedMobile"></span>
      </div>

      <p>
        Welcome to the Home Screen
      </p>

      <button
        class="primary"
        onclick="logoutUser()"
      >
        Logout
      </button>

    </section>

  </div>


  <script>

    /*
      IMPORTANT:
      Replace ONLY the Firebase Configuration below
      with the exact configuration from Firebase Console.
    */

    const firebaseConfig = {
      apiKey: "PASTE_EXACT_FIREBASE_API_KEY_HERE",
      authDomain: "ysrcp-yerragondapalem-70f87.firebaseapp.com",
      projectId: "ysrcp-yerragondapalem-70f87",
      storageBucket: "ysrcp-yerragondapalem-70f87.firebasestorage.app",
      messagingSenderId: "299917147474",
      appId: "PASTE_EXACT_FIREBASE_APP_ID_HERE",
      measurementId: "PASTE_EXACT_MEASUREMENT_ID_HERE"
    };


    // Start Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    let confirmationResult = null;
    let currentMode = "";
    let currentMobile = "";

    let registrationRecaptchaVerifier = null;
    let loginRecaptchaVerifier = null;


    function hideAllScreens() {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("registrationScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("otpScreen").classList.add("hidden");
      document.getElementById("homeScreen").classList.add("hidden");
    }


    function clearMessages() {
      document.getElementById("startError").innerText = "";

      document.getElementById("registrationError").innerText = "";
      document.getElementById("registrationSuccess").innerText = "";

      document.getElementById("loginError").innerText = "";
      document.getElementById("loginSuccess").innerText = "";

      document.getElementById("otpError").innerText = "";
      document.getElementById("otpSuccess").innerText = "";
    }


    function showRegistration() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("registrationScreen")
        .classList.remove("hidden");

      document
        .getElementById("registrationMobile")
        .focus();
    }


    function showLogin() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("loginScreen")
        .classList.remove("hidden");

      document
        .getElementById("loginMobile")
        .focus();
    }


    function goBack() {
      hideAllScreens();
      clearMessages();

      document
        .getElementById("startScreen")
        .classList.remove("hidden");
    }


    function goBackToMobileScreen() {
      hideAllScreens();
      clearMessages();

      if (currentMode === "registration") {
        document
          .getElementById("registrationScreen")
          .classList.remove("hidden");
      } else {
        document
          .getElementById("loginScreen")
          .classList.remove("hidden");
      }
    }


    function validateMobile(mobile) {
      return /^[6-9][0-9]{9}$/.test(mobile);
    }


    function createRegistrationRecaptcha() {
      if (!registrationRecaptchaVerifier) {
        registrationRecaptchaVerifier =
          new firebase.auth.RecaptchaVerifier(
            "registrationRecaptcha",
            {
              size: "invisible"
            }
          );
      }

      return registrationRecaptchaVerifier;
    }


    function createLoginRecaptcha() {
      if (!loginRecaptchaVerifier) {
        loginRecaptchaVerifier =
          new firebase.auth.RecaptchaVerifier(
            "loginRecaptcha",
            {
              size: "invisible"
            }
          );
      }

      return loginRecaptchaVerifier;
    }


    function setButtonLoading(buttonId, isLoading, normalText) {
      const button = document.getElementById(buttonId);

      button.disabled = isLoading;
      button.innerText = isLoading
        ? "Please wait..."
        : normalText;
    }


    function sendRegistrationOTP() {
      clearMessages();

      const mobile = document
        .getElementById("registrationMobile")
        .value
        .trim();

      if (!validateMobile(mobile)) {
        document
          .getElementById("registrationError")
          .innerText =
          "Please enter a valid 10 digit Indian mobile number.";

        return;
      }

      currentMode = "registration";
      currentMobile = mobile;

      const phoneNumber = "+91" + mobile;

      const appVerifier = createRegistrationRecaptcha();

      document
        .getElementById("registrationSuccess")
        .innerText =
        "Sending OTP. Please wait...";

      setButtonLoading(
        "registrationSendButton",
        true,
        "Send OTP"
      );

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then(function (result) {
          confirmationResult = result;

          hideAllScreens();

          document
            .getElementById("otpScreen")
            .classList.remove("hidden");

          document
            .getElementById("otpMessage")
            .innerText =
            "Enter the OTP sent to +91 " + currentMobile;

          document
            .getElementById("otpInput")
            .focus();
        })
        .catch(function (error) {
          document
            .getElementById("registrationError")
            .innerText =
            getFriendlyError(error);

          resetRegistrationRecaptcha();
        })
        .finally(function () {
          setButtonLoading(
            "registrationSendButton",
            false,
            "Send OTP"
          );
        });
    }


    function sendLoginOTP() {
      clearMessages();

      const mobile = document
        .getElementById("loginMobile")
        .value
        .trim();

      if (!validateMobile(mobile)) {
        document
          .getElementById("loginError")
          .innerText =
          "Please enter a valid 10 digit Indian mobile number.";

        return;
      }

      currentMode = "login";
      currentMobile = mobile;

      const phoneNumber = "+91" + mobile;

      const appVerifier = createLoginRecaptcha();

      document
        .getElementById("loginSuccess")
        .innerText =
        "Sending OTP. Please wait...";

      setButtonLoading(
        "loginSendButton",
        true,
        "Send OTP"
      );

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then(function (result) {
          confirmationResult = result;

          hideAllScreens();

          document
            .getElementById("otpScreen")
            .classList.remove("hidden");

          document
            .getElementById("otpMessage")
            .innerText =
            "Enter the OTP sent to +91 " + currentMobile;

          document
            .getElementById("otpInput")
            .focus();
        })
        .catch(function (error) {
          document
            .getElementById("loginError")
            .innerText =
            getFriendlyError(error);

          resetLoginRecaptcha();
        })
        .finally(function () {
          setButtonLoading(
            "loginSendButton",
            false,
            "Send OTP"
          );
        });
    }


    function verifyOTP() {
      clearMessages();

      const otp = document
        .getElementById("otpInput")
        .value
        .trim();

      if (!/^[0-9]{6}$/.test(otp)) {
        document
          .getElementById("otpError")
          .innerText =
          "Please enter the 6 digit OTP.";

        return;
      }

      if (!confirmationResult) {
        document
          .getElementById("otpError")
          .innerText =
          "OTP session expired. Please request a new OTP.";

        return;
      }

      document
        .getElementById("otpSuccess")
        .innerText =
        "Verifying OTP. Please wait...";

      setButtonLoading(
        "verifyButton",
        true,
        "Verify OTP"
      );

      confirmationResult.confirm(otp)
        .then(function (result) {
          const user = result.user;

          document
            .getElementById("loggedMobile")
            .innerText =
            user.phoneNumber || "+91 " + currentMobile;

          hideAllScreens();

          document
            .getElementById("homeScreen")
            .classList.remove("hidden");
        })
        .catch(function (error) {
          document
            .getElementById("otpError")
            .innerText =
            getFriendlyError(error);
        })
        .finally(function () {
          setButtonLoading(
            "verifyButton",
            false,
            "Verify OTP"
          );
        });
    }


    function logoutUser() {
      auth.signOut()
        .then(function () {
          confirmationResult = null;
          currentMode = "";
          currentMobile = "";

          document
            .getElementById("otpInput")
            .value = "";

          goBack();
        })
        .catch(function (error) {
          document
            .getElementById("otpError")
            .innerText =
            getFriendlyError(error);
        });
    }


    function resetRegistrationRecaptcha() {
      if (registrationRecaptchaVerifier) {
        registrationRecaptchaVerifier.clear();
        registrationRecaptchaVerifier = null;
      }
    }


    function resetLoginRecaptcha() {
      if (loginRecaptchaVerifier) {
        loginRecaptchaVerifier.clear();
        loginRecaptchaVerifier = null;
      }
    }


    function getFriendlyError(error) {
      if (!error || !error.code) {
        return "Something went wrong. Please try again.";
      }

      switch (error.code) {

        case "auth/api-key-not-valid":
          return "Firebase API key is invalid. Please check the Firebase configuration.";

        case "auth/invalid-api-key":
          return "Firebase API key is invalid. Please check the Firebase configuration.";

        case "auth/invalid-phone-number":
          return "Invalid mobile number. Please check and try again.";

        case "auth/too-many-requests":
          return "Too many OTP requests. Please wait and try again later.";

        case "auth/quota-exceeded":
          return "SMS quota exceeded. Please try again later.";

        case "auth/operation-not-allowed":
          return "Phone Authentication is not enabled in Firebase.";

        case "auth/captcha-check-failed":
          return "Security verification failed. Please refresh the page and try again.";

        case "auth/invalid-verification-code":
          return "Incorrect OTP. Please enter the correct OTP.";

        case "auth/code-expired":
          return "OTP expired. Please request a new OTP.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        case "auth/unauthorized-domain":
          return "This website domain is not authorized in Firebase.";

        case "auth/missing-phone-number":
          return "Please enter your mobile number.";

        default:
          return error.message || "Something went wrong. Please try again.";
      }
    }


    auth.onAuthStateChanged(function (user) {
      if (user) {
        document
          .getElementById("loggedMobile")
          .innerText =
          user.phoneNumber || "";

        hideAllScreens();

        document
          .getElementById("homeScreen")
          .classList.remove("hidden");
      } else {
        hideAllScreens();

        document
          .getElementById("startScreen")
          .classList.remove("hidden");
      }
    });

  </script>

</body>
</html>
