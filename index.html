<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff7e6, #f5f5f5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo-title {
      color: #a45b24;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #222;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d88900;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d88900;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b97000;
    }

    .error {
      color: #d32f2f;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .home-screen {
      display: none;
    }

    .welcome {
      font-size: 20px;
      color: #333;
      margin: 20px 0;
    }

    .mobile-display {
      background: #fff4dc;
      padding: 15px;
      border-radius: 10px;
      color: #8b5600;
      font-weight: bold;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .logout-btn {
      background: #d32f2f;
    }

    .logout-btn:hover {
      background: #a92323;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div class="card" id="loginScreen">

      <div class="logo-title">
        YSRCP YERRAGONDAPALEM
      </div>

      <h2>Login</h2>

      <p class="subtitle">
        Enter your mobile number and password
      </p>

      <input
        type="tel"
        id="mobileNumber"
        placeholder="Mobile Number"
        maxlength="10"
        inputmode="numeric"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        maxlength="4"
        inputmode="numeric"
      />

      <button onclick="loginUser()">
        Login
      </button>

      <p class="error" id="errorMessage"></p>

    </div>


    <!-- HOME SCREEN -->
    <div class="card home-screen" id="homeScreen">

      <div class="logo-title">
        YSRCP YERRAGONDAPALEM
      </div>

      <h2>Welcome</h2>

      <p class="welcome">
        Login successful
      </p>

      <div class="mobile-display">
        Mobile Number:
        <span id="displayMobile"></span>
      </div>

      <button class="logout-btn" onclick="logoutUser()">
        Logout
      </button>

    </div>

  </div>


  <script>

    function loginUser() {

      const mobileNumber =
        document.getElementById("mobileNumber").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const errorMessage =
        document.getElementById("errorMessage");

      errorMessage.textContent = "";

      // Mobile number must contain exactly 10 digits
      if (!/^[0-9]{10}$/.test(mobileNumber)) {
        errorMessage.textContent =
          "Please enter a valid 10 digit mobile number.";
        return;
      }

      // First 4 digits of entered mobile number are the password
      const correctPassword =
        mobileNumber.substring(0, 4);

      // Check password
      if (password !== correctPassword) {
        errorMessage.textContent =
          "Invalid password.";
        return;
      }

      // Show Home Screen
      document.getElementById("loginScreen").style.display = "none";

      document.getElementById("homeScreen").style.display = "block";

      document.getElementById("displayMobile").textContent =
        mobileNumber;

    }


    function logoutUser() {

      document.getElementById("homeScreen").style.display = "none";

      document.getElementById("loginScreen").style.display = "block";

      document.getElementById("mobileNumber").value = "";

      document.getElementById("password").value = "";

      document.getElementById("errorMessage").textContent = "";

    }

  </script>

</body>
</html>
