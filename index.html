<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YSRCP YERRAGONDAPALEM - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #075bb5, #008b55);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #075bb5;
      font-size: 38px;
      letter-spacing: 3px;
    }

    .logo h2 {
      color: #008b55;
      font-size: 20px;
      margin-top: 5px;
    }

    .logo p {
      color: #555;
      font-size: 12px;
      margin-top: 12px;
    }

    h3 {
      text-align: center;
      color: #17233c;
      margin-bottom: 25px;
      font-size: 23px;
    }

    label {
      display: block;
      color: #17233c;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd8df;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #075bb5;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #008b55;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #006f45;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #d00000;
    }

    .info {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>YSRCP</h1>
      <h2>YERRAGONDAPALEM</h2>
      <p>PEOPLE • PROGRESS • PROSPERITY</p>
    </div>

    <h3>Member Login</h3>

    <label for="mobileNumber">Mobile Number</label>

    <input
      type="tel"
      id="mobileNumber"
      maxlength="10"
      inputmode="numeric"
      placeholder="Enter 10-digit mobile number"
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      maxlength="4"
      inputmode="numeric"
      placeholder="Enter first 4 digits"
    >

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <p id="message" class="message"></p>

    <p class="info">
      Enter the first 4 digits of your mobile number as password.
    </p>

  </div>

  <script>

    function login() {

      const mobile =
        document.getElementById("mobileNumber").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const message =
        document.getElementById("message");

      message.style.color = "#d00000";

      if (!/^[0-9]{10}$/.test(mobile)) {

        message.innerText =
          "Please enter a valid 10-digit mobile number.";

        return;

      }

      if (!/^[0-9]{4}$/.test(password)) {

        message.innerText =
          "Please enter a 4-digit password.";

        return;

      }

      const correctPassword =
        mobile.substring(0, 4);

      if (password !== correctPassword) {

        message.innerText =
          "Incorrect password. Enter the first 4 digits of your mobile number.";

        return;

      }

      message.style.color = "#008b55";

      message.innerText =
        "Login successful.";

      alert("Login successful");

    }

  </script>

</body>
</html>
