<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7e6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      color: #d88900;
      font-size: 25px;
      margin-bottom: 8px;
    }

    h2 {
      color: #333;
      font-size: 22px;
      margin-bottom: 20px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #e59b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c98300;
    }

    button.secondary {
      background: #555;
    }

    button.secondary:hover {
      background: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 15px;
      color: #d00000;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: green;
    }

    #recaptcha-container {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    .home-box {
      background: #fff4d6;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .small {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- START SCREEN -->
    <section id="startScreen">
      <h1>YSRCP YERRAGONDAPALEM</h1>
      <p>Welcome to the official member app</p>

      <button id="newRegistrationBtn">
        New Registration
      </button>

      <button id="loginBtn" class="secondary">
        Login
      </button>
    </section>

    <!-- PHONE SCREEN -->
    <section id="phoneScreen" class="hidden">
      <h2 id="phoneTitle">New Registration</h2>

      <p>Enter your mobile number</p>

      <input
        id="phoneInput"
        type="tel"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      />

      <button id="sendOtpBtn">
        Send OTP
      </button>

      <div id="recaptcha-container"></div>

      <button id="backBtn" class="secondary">
        Back
      </button>

      <div id="phoneMessage" class="message"></div>
    </section>

    <!-- OTP SCREEN -->
    <section id="otpScreen" class="hidden">
      <h2>Verify OTP</h2>

      <p>OTP sent to your mobile number</p>

      <input
        id="otpInput"
        type="number"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
      />

      <button id="verifyOtpBtn">
        Verify OTP
      </button>

      <button id="otpBackBtn" class="secondary">
        Back
      </button>

      <div id="otpMessage" class="message"></div>
    </section>

    <!-- HOME SCREEN -->
    <section id="homeScreen" class="hidden">
      <h1>YSRCP YERRAGONDAPALEM</h1>

      <div class="home-box">
        <h2>Welcome</h2>
        <p class="success">
          You have successfully logged in.
        </p>
        <p id="userPhone"></p>
      </div>

      <button id="logoutBtn" class="secondary">
        Logout
      </button>
    </section>

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUhbObA7zEaNAtdSktvZYXmEENCz29zQ8",
      authDomain: "ysrcp-yerragondapalem-70f87.firebaseapp.com",
      projectId: "ysrcp-yerragondapalem-70f87",
      storageBucket: "ysrcp-yerragondapalem-70f87.firebasestorage.app",
      messagingSenderId: "299917147474",
      appId: "1:299917147474:web:ededaaf3c289cc08250e8b",
      measurementId: "G-1V385HHPGC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let confirmationResult = null;
    let recaptchaVerifier = null;
    let currentMode = "registration";

    const startScreen = document.getElementById("startScreen");
    const phoneScreen = document.getElementById("phoneScreen");
    const otpScreen = document.getElementById("otpScreen");
    const homeScreen = document.getElementById("homeScreen");

    const phoneTitle = document.getElementById("phoneTitle");
    const phoneInput = document.getElementById("phoneInput");
    const otpInput = document.getElementById("otpInput");

    const phoneMessage = document.getElementById("phoneMessage");
    const otpMessage = document.getElementById("otpMessage");

    const newRegistrationBtn =
      document.getElementById("newRegistrationBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const sendOtpBtn =
      document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
      document.getElementById("verifyOtpBtn");

    const backBtn =
      document.getElementById("backBtn");

    const otpBackBtn =
      document.getElementById("otpBackBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    function showScreen(screen) {
      startScreen.classList.add("hidden");
      phoneScreen.classList.add("hidden");
      otpScreen.classList.add("hidden");
      homeScreen.classList.add("hidden");

      screen.classList.remove("hidden");
    }

    function showMessage(element, message, success = false) {
      element.textContent = message;
      element.className = success
        ? "message success"
        : "message";
    }

    function clearMessages() {
      phoneMessage.textContent = "";
      otpMessage.textContent = "";
    }

    function resetRecaptcha() {
      if (recaptchaVerifier) {
        try {
          recaptchaVerifier.clear();
        } catch (error) {
          console.log("reCAPTCHA clear error:", error);
        }
        recaptchaVerifier = null;
      }

      document.getElementById("recaptcha-container").innerHTML = "";
    }

    function createRecaptcha() {
      resetRecaptcha();

      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal",
          callback: function () {
            showMessage(
              phoneMessage,
              "reCAPTCHA verified. Now press Send OTP.",
              true
            );
          },
          "expired-callback": function () {
            showMessage(
              phoneMessage,
              "reCAPTCHA expired. Please verify again."
            );
          }
        }
      );

      recaptchaVerifier.render().catch(function (error) {
        console.error("reCAPTCHA error:", error);
        showMessage(
          phoneMessage,
          "reCAPTCHA load కాలేదు. Page refresh చేయండి."
        );
      });
    }

    function openPhoneScreen(mode) {
      currentMode = mode;

      phoneTitle.textContent =
        mode === "registration"
          ? "New Registration"
          : "Login";

      phoneInput.value = "";
      otpInput.value = "";
      clearMessages();

      showScreen(phoneScreen);
      createRecaptcha();
    }

    newRegistrationBtn.addEventListener("click", function () {
      openPhoneScreen("registration");
    });

    loginBtn.addEventListener("click", function () {
      openPhoneScreen("login");
    });

    backBtn.addEventListener("click", function () {
      resetRecaptcha();
      clearMessages();
      showScreen(startScreen);
    });

    otpBackBtn.addEventListener("click", function () {
      showScreen(phoneScreen);
    });

    sendOtpBtn.addEventListener("click", async function () {

      clearMessages();

      let mobile = phoneInput.value.trim();

      if (!/^[6-9][0-9]{9}$/.test(mobile)) {
        showMessage(
          phoneMessage,
          "దయచేసి సరైన 10 digit Indian mobile number ఇవ్వండి."
        );
        return;
      }

      if (!recaptchaVerifier) {
        showMessage(
          phoneMessage,
          "reCAPTCHA ఇంకా load కాలేదు. Page refresh చేసి ప్రయత్నించండి."
        );
        return;
      }

      const phoneNumber = "+91" + mobile;

      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = "Sending OTP...";

      try {

        confirmationResult = await signInWithPhoneNumber(
          auth,
          phoneNumber,
          recaptchaVerifier
        );

        showMessage(
          phoneMessage,
          "OTP మీ మొబైల్‌కు పంపబడింది.",
          true
        );

        showScreen(otpScreen);

      } catch (error) {

        console.error(error);

        let message = error.message;

        if (error.code === "auth/invalid-phone-number") {
          message = "Mobile number తప్పుగా ఉంది.";
        }

        if (error.code === "auth/too-many-requests") {
          message = "చాలా OTPలు పంపబడ్డాయి. కొంతసేపటి తర్వాత ప్రయత్నించండి.";
        }

        if (error.code === "auth/quota-exceeded") {
          message = "Firebase SMS daily quota పూర్తయింది.";
        }

        if (error.code === "auth/operation-not-allowed") {
          message = "Firebase Phone Authentication enable చేయలేదు.";
        }

        showMessage(phoneMessage, message);

        createRecaptcha();

      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP";
      }

    });

    verifyOtpBtn.addEventListener("click", async function () {

      clearMessages();

      const otp = otpInput.value.trim();

      if (!/^[0-9]{6}$/.test(otp)) {
        showMessage(
          otpMessage,
          "దయచేసి 6 digit OTP ఇవ్వండి."
        );
        return;
      }

      if (!confirmationResult) {
        showMessage(
          otpMessage,
          "ముందుగా Send OTP ప్రెస్ చేయండి."
        );
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = "Verifying...";

      try {

        await confirmationResult.confirm(otp);

        showMessage(
          otpMessage,
          "OTP verified successfully.",
          true
        );

      } catch (error) {

        console.error(error);

        let message = "OTP verification failed.";

        if (error.code === "auth/invalid-verification-code") {
          message = "OTP తప్పుగా ఉంది.";
        }

        if (error.code === "auth/code-expired") {
          message = "OTP గడువు ముగిసింది. మళ్లీ OTP పంపించండి.";
        }

        showMessage(otpMessage, message);

      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "Verify OTP";
      }

    });

    logoutBtn.addEventListener("click", async function () {
      await signOut(auth);
      showScreen(startScreen);
    });

    onAuthStateChanged(auth, function (user) {

      if (user) {
        document.getElementById("userPhone").textContent =
          "Mobile: " + (user.phoneNumber || "");

        showScreen(homeScreen);
      } else {
        showScreen(startScreen);
      }

    });

  </script>

</body>
</html>
