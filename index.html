<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #fff1d6, #ffffff);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 22px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      color: #b66b00;
      font-size: 24px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    h2 {
      color: #222;
      margin-bottom: 22px;
    }

    p {
      color: #555;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #d88900;
      color: white;
    }

    .logout {
      background: #222;
      color: white;
    }

    .hidden {
      display: none;
    }

    .error {
      color: red;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      color: green;
      margin-top: 15px;
      font-size: 14px;
    }

    .user-box {
      background: #fff5df;
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
      color: #333;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="card">

    <h1>YSRCP YERRAGONDAPALEM</h1>

    <h2>Login</h2>

    <p>Enter your mobile number and password</p>

    <input
      type="tel"
      id="mobileNumber"
      placeholder="Enter mobile number"
      maxlength="10"
      inputmode="numeric"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      maxlength="20"
    >

    <button class="login" onclick="loginUser()">
      Login
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <!-- HOME SCREEN -->
  <div id="homeScreen" class="card hidden">

    <h1>YSRCP YERRAGONDAPALEM</h1>

    <div class="user-box">
      <b>Login Successful</b>
      <br>
      <span id="userMobile"></span>
    </div>

    <p>Welcome to the Home Screen</p>

    <button class="logout" onclick="logoutUser()">
      Logout
    </button>

  </div>


  <script>

    /*
      మీ నంబర్‌ను ఇక్కడ పెట్టండి.
      ఉదాహరణకు: 9876543210
    */

    const myMobileNumber = "YOUR_MOBILE_NUMBER";

    /*
      Default Password:
      మీ ఫోన్ నంబర్‌లోని మొదటి 4 digits
    */

    const defaultPassword = myMobileNumber.substring(0, 4);


    function loginUser() {

      const mobile = document
        .getElementById("mobileNumber")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value
        .trim();

      const error = document.getElementById("loginError");

      error.innerText = "";

      if (mobile === "") {
        error.innerText = "Please enter your mobile number.";
        return;
      }

      if (password === "") {
        error.innerText = "Please enter your password.";
        return;
      }

      if (mobile !== myMobileNumber) {
        error.innerText = "Invalid mobile number.";
        return;
      }

      if (password !== defaultPassword) {
        error.innerText = "Invalid password.";
        return;
      }

      document.getElementById("loginScreen")
        .classList.add("hidden");

      document.getElementById("homeScreen")
        .classList.remove("hidden");

      document.getElementById("userMobile")
        .innerText = "Mobile Number: " + mobile;

    }


    function logoutUser() {

      document.getElementById("homeScreen")
        .classList.add("hidden");

      document.getElementById("loginScreen")
        .classList.remove("hidden");

      document.getElementById("mobileNumber").value = "";
      document.getElementById("password").value = "";
      document.getElementById("loginError").innerText = "";

    }

  </script>

</body>
</html>
