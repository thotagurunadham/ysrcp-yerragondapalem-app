<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0066cc, #008f5a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-screen {
      width: 100%;
      max-width: 390px;
      min-height: 720px;
      border-radius: 28px;
      overflow: hidden;
      background: white;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-section {
      text-align: center;
      color: white;
      padding: 45px 20px 35px;
      background: linear-gradient(160deg, #075fc4, #008b61);
    }

    .top-section h1 {
      font-size: 30px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .top-section h2 {
      font-size: 20px;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .top-section p {
      margin-top: 15px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      padding: 45px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .welcome-text {
      text-align: center;
      color: #183b65;
      margin-bottom: 10px;
    }

    .welcome-text h3 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .welcome-text p {
      font-size: 14px;
      color: #666;
    }

    .app-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .register-btn {
      background: #08a65b;
      color: white;
    }

    .login-btn {
      background: white;
      color: #075fc4;
      border: 2px solid #075fc4;
    }

    .app-button:active {
      transform: scale(0.98);
    }

    .bottom-section {
      background: #f2f7fb;
      text-align: center;
      padding: 22px 15px;
      color: #24466c;
      font-size: 13px;
      line-height: 1.6;
    }

    .bottom-section strong {
      display: block;
      color: #008b61;
      font-size: 14px;
      margin-bottom: 5px;
    }

    @media (max-height: 700px) {
      .app-screen {
        min-height: 620px;
      }

      .top-section {
        padding: 30px 15px;
      }

      .content {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="app-screen">

    <section class="top-section">
      <h1>YSRCP</h1>
      <h2>YERRAGONDAPALEM</h2>
      <p>PEOPLE • PROGRESS • PROSPERITY</p>
    </section>

    <section class="content">

      <div class="welcome-text">
        <h3>Welcome</h3>
        <p>YSRCP Yerragondapalem Digital Platform</p>
      </div>

      <button class="app-button register-btn" onclick="newRegistration()">
        👤 New Registration
      </button>

      <button class="app-button login-btn" onclick="loginUser()">
        🔒 Login
      </button>

    </section>

    <footer class="bottom-section">
      <strong>YSRCP YERRAGONDAPALEM</strong>
      Digital Platform for Party Members
    </footer>

  </main>

  <script>
    function newRegistration() {
      alert("New Registration screen will open in the next step.");
    }

    function loginUser() {
      alert("Login screen will open in the next step.");
    }
  </script>

</body>
</html>
