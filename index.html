<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YSRCP YERRAGONDAPALEM</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fff3d6, #ffffff);
    }

    .container {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 28px 22px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #b87900;
    }

    h2 {
      font-size: 24px;
      color: #222;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d99500;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #d99100;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #b97800;
    }

    .back-button {
      background: #333;
    }

    .back-button:hover {
      background: #111;
    }

    .hidden {
      display: none;
    }

    #recaptcha-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #c62828;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      color: green;
    }

    .home-text {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin: 25px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- START SCREEN -->
    <div id="start-screen">
      <h1>YSRCP YERRAGONDAPALEM</h1>

      <button onclick="showRegistration()">
        New Registration
      </button>

      <button onclick="showLogin()">
        Login
      </button>
    </div>

    <!-- REGISTRATION SCREEN -->
    <div id="registration-screen" class="hidden">
      <h2>New Registration</h2>

      <p>Enter your mobile number</p>

      <input
        type="tel"
        id="register-mobile"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      />

      <button id="send-register-otp-btn" onclick="sendRegistrationOTP()">
        Send OTP
      </button>

      <div id="register-recaptcha"></div>

      <div id="register-otp-section" class="hidden">
        <input
          type="text"
          id="register-otp"
          placeholder="Enter OTP"
          maxlength="6"
        />

        <button onclick="verifyRegistrationOTP()">
          Verify OTP
        </button>
      </div>

      <button class="back-button" onclick="goBack()">
        Back
      </button>

      <div id="register-message" class="message"></div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden">
      <h2>Login</h2>

      <p>Enter your mobile number</p>

      <input
        type="tel"
        id="login-mobile"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
      />

      <button onclick="sendLoginOTP()">
        Send OTP
      </button>

      <div id="login-recaptcha"></div>

      <div id="login-otp-section" class="hidden">
        <input
          type="text"
          id="login-otp"
          placeholder="Enter OTP"
          maxlength="6"
        />

        <button onclick="verifyLoginOTP()">
          Verify OTP
        </button>
      </div>

      <button class="back-button" onclick="goBack()">
        Back
      </button>

      <div id="login-message" class="message"></div>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="hidden">
      <h1>YSRCP YERRAGONDAPALEM</h1>

      <div class="home-text">
        Login Successful
      </div>

      <p>Welcome to Home Screen</p>

      <button class="back-button" onclick="logoutUser()">
        Logout
      </button>
    </div>

  </div>

  <!-- FIREBASE CODE -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUhbObA7zEaNAtdSktvZYXmEENCz29zQ8",
      authDomain: "ysrcp-yerragondapalem-70f87.firebaseapp.com",
      projectId: "ysrcp-yerragondapalem-70f87",
      storageBucket: "ysrcp-yerragondapalem-70f87.firebasestorage.app",
      messagingSenderId: "299917147474",
      appId: "1:299917147474:web:ededaaf3c289cc08250e8b",
      measurementId: "G-1V385HHPGC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let registerConfirmationResult = null;
    let loginConfirmationResult = null;

    let registerRecaptchaVerifier = null;
    let loginRecaptchaVerifier = null;

    window.showRegistration = function () {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.add("hidden");
      document.getElementById("registration-screen").classList.remove("hidden");

      clearMessages();
    };

    window.showLogin = function () {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("registration-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");

      clearMessages();
    };

    window.goBack = function () {
      document.getElementById("registration-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.add("hidden");
      document.getElementById("start-screen").classList.remove("hidden");

      clearMessages();
    };

    function clearMessages() {
      document.getElementById("register-message").innerText = "";
      document.getElementById("login-message").innerText = "";
    }

    function validMobileNumber(number) {
      return /^[6-9][0-9]{9}$/.test(number);
    }

    function createRegisterRecaptcha() {
      if (registerRecaptchaVerifier) {
        return registerRecaptchaVerifier;
      }

      registerRecaptchaVerifier = new RecaptchaVerifier(
        auth,
        "register-recaptcha",
        {
          size: "normal",
          callback: function () {
            console.log("Registration reCAPTCHA completed");
          },
          "expired-callback": function () {
            document.getElementById("register-message").innerText =
              "reCAPTCHA expired. Please complete it again.";
          }
        }
      );

      return registerRecaptchaVerifier;
    }

    function createLoginRecaptcha() {
      if (loginRecaptchaVerifier) {
        return loginRecaptchaVerifier;
      }

      loginRecaptchaVerifier = new RecaptchaVerifier(
        auth,
        "login-recaptcha",
        {
          size: "normal",
          callback: function () {
            console.log("Login reCAPTCHA completed");
          },
          "expired-callback": function () {
            document.getElementById("login-message").innerText =
              "reCAPTCHA expired. Please complete it again.";
          }
        }
      );

      return loginRecaptchaVerifier;
    }

    window.sendRegistrationOTP = async function () {
      const mobile =
        document.getElementById("register-mobile").value.trim();

      const message =
        document.getElementById("register-message");

      if (!validMobileNumber(mobile)) {
        message.innerText =
          "దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి.";
        return;
      }

      const phoneNumber = "+91" + mobile;

      try {
        message.innerText = "reCAPTCHA పూర్తి చేయండి...";

        const appVerifier = createRegisterRecaptcha();

        registerConfirmationResult =
          await signInWithPhoneNumber(
            auth,
            phoneNumber,
            appVerifier
          );

        document
          .getElementById("register-otp-section")
          .classList.remove("hidden");

        message.classList.add("success");
        message.innerText =
          "OTP మీ మొబైల్‌కు పంపబడింది.";

      } catch (error) {
        console.error(error);

        message.classList.remove("success");
        message.innerText =
          "OTP పంపలేకపోయింది: " + error.message;
      }
    };

    window.verifyRegistrationOTP = async function () {
      const otp =
        document.getElementById("register-otp").value.trim();

      const message =
        document.getElementById("register-message");

      if (!/^[0-9]{6}$/.test(otp)) {
        message.innerText =
          "6 అంకెల OTP నమోదు చేయండి.";
        return;
      }

      try {
        await registerConfirmationResult.confirm(otp);

        message.classList.add("success");
        message.innerText =
          "Registration Successful";

        showHome();

      } catch (error) {
        console.error(error);

        message.classList.remove("success");
        message.innerText =
          "తప్పు OTP. మళ్లీ ప్రయత్నించండి.";
      }
    };

    window.sendLoginOTP = async function () {
      const mobile =
        document.getElementById("login-mobile").value.trim();

      const message =
        document.getElementById("login-message");

      if (!validMobileNumber(mobile)) {
        message.innerText =
          "దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి.";
        return;
      }

      const phoneNumber = "+91" + mobile;

      try {
        message.innerText = "reCAPTCHA పూర్తి చేయండి...";

        const appVerifier = createLoginRecaptcha();

        loginConfirmationResult =
          await signInWithPhoneNumber(
            auth,
            phoneNumber,
            appVerifier
          );

        document
          .getElementById("login-otp-section")
          .classList.remove("hidden");

        message.classList.add("success");
        message.innerText =
          "OTP మీ మొబైల్‌కు పంపబడింది.";

      } catch (error) {
        console.error(error);

        message.classList.remove("success");
        message.innerText =
          "OTP పంపలేకపోయింది: " + error.message;
      }
    };

    window.verifyLoginOTP = async function () {
      const otp =
        document.getElementById("login-otp").value.trim();

      const message =
        document.getElementById("login-message");

      if (!/^[0-9]{6}$/.test(otp)) {
        message.innerText =
          "6 అంకెల OTP నమోదు చేయండి.";
        return;
      }

      try {
        await loginConfirmationResult.confirm(otp);

        message.classList.add("success");
        message.innerText =
          "Login Successful";

        showHome();

      } catch (error) {
        console.error(error);

        message.classList.remove("success");
        message.innerText =
          "తప్పు OTP. మళ్లీ ప్రయత్నించండి.";
      }
    };

    function showHome() {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("registration-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("home-screen").classList.remove("hidden");
    }

    window.logoutUser = async function () {
      await signOut(auth);
      goBack();
    };

    onAuthStateChanged(auth, function (user) {
      if (user) {
        console.log("User logged in:", user.phoneNumber);
      } else {
        console.log("No user logged in");
      }
    });

  </script>

</body>
</html>
